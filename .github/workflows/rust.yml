name: Rust

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # The burn backend, built without ONNX Runtime.
  burn:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Run tests
      run: cargo test --verbose --no-default-features --features wgpu,multitalker,cohere
    - name: Build the GPU backends CI cannot run (Vulkan, CUDA, ROCm)
      run: cargo check --verbose --no-default-features --features vulkan,burn-cuda,burn-rocm,x86-v4,multitalker,cohere
    - name: Build burn without the optional models
      run: cargo check --verbose --no-default-features --features burn
    - name: Build both backends together
      run: cargo check --verbose --features burn,multitalker,cohere

  # Apple GPUs (`metal` builds on Apple targets only).
  burn-metal:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --verbose --no-default-features --features metal,apple-amx,multitalker,cohere

  release:
    needs: [test, burn, burn-metal]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
